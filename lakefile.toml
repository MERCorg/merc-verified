name = "merc-verified"
version = "0.1.0"
defaultTargets = ["MercVerified", "Signatures", "Rewriting", "Sigref", "Refinement", "ParityGame"]

[[lean_lib]]
name = "MercVerified"
globs = ["MercVerified.*"]

[[lean_lib]]
name = "Signatures"
globs = ["Signatures.*"]

[[lean_lib]]
name = "Sigref"
globs = ["Sigref.*"]

[[lean_lib]]
name = "Refinement"
globs = ["Refinement.*"]

[[lean_lib]]
name = "ParityGame"
globs = ["ParityGame.*"]

[[lean_lib]]
name = "Rewriting"
globs = ["Rewriting.*"]

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.35.0-rc4"

[[require]]
name = "aeneas"
path = "3rd-party/aeneas/backends/lean"