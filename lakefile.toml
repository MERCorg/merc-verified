name = "merc-verified"
version = "0.1.0"
defaultTargets = ["MercVerified", "MercLib"]

[[lean_lib]]
name = "MercVerified"
globs = ["MercVerified.*"]

[[lean_lib]]
name = "MercLib"
globs = ["MercLib.*"]

# `lake comparator` challenges/solutions (see `comparator.json`); not a default target, since the
# challenges state their theorems with `sorry`.
[[lean_lib]]
name = "Challenges"
globs = ["Challenges.+"]

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.35.0-rc4"

[[require]]
name = "aeneas"
path = "3rd-party/aeneas/backends/lean"