name: Generate Aeneas Code

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
        
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Install OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3
        dune-cache: true

    - name: Install OCaml Dependencies
      run: opam install -y ppx_deriving visitors easy_logging zarith yojson core_unix odoc ocamlgraph menhir ocamlformat.0.27.0 unionFind zarith progress domainslib

    - name: Build charon
      run: |
        eval $(opam env)
        make setup-charon
      working-directory: ./3rd-party/aeneas
      env:        
        RUSTC_WRAPPER: sccache

    - name: Build aeneas
      run: |
        eval $(opam env)
        make
      working-directory: ./3rd-party/aeneas

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Generate LLBC using Charon
      run: ../3rd-party/aeneas/charon/bin/charon cargo --preset=aeneas 
      working-directory: ./verified

    - name: Generate lean code using aeneas
      run: ./3rd-party/aeneas/bin/aeneas -split-files -backend=lean -dest=. -subdir=MercVerified/Code ./verified/verified.llbc

    - name: Check generated code matches checked-in code
      run: |
        git add --intent-to-add MercVerified/Code
        if ! git diff --exit-code -- MercVerified/Code; then
          echo "::error::Generated Lean code in MercVerified/Code does not match the checked-in version."
          echo "Run the generation steps locally and commit the result."
          exit 1
        fi
