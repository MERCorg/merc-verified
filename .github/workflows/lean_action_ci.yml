name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
        
    - name: Install and build Lean
      uses: leanprover/lean-action@v1

    - name : Build Lean code
      run: lake build

    - name: Check MercLib headline theorems against the challenges
      run: lake comparator --config comparator.json

    - name: Check MercVerified headline theorems against the challenges
      run: lake comparator --config comparator_MercVerified.json

    - name: Check the exported API against EXPORTS.md
      run: lake env lean --run scripts/CheckExports.lean

    - name: Run the MercLib tests (MercLibTest)
      run: lake test
